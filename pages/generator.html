			<h1>Password Generator</h1>

			<form>
				<input type="number" value="8" placeholder="Required password length" id="length-input">
				<label>
					<input type="checkbox" id="lowercase-checkbox">
					lowercase
				</label>
				<label>
					<input type="checkbox" id="uppercase-checkbox">
					uppercase
				</label>
				<label>
					<input type="checkbox" id="numbers-checkbox">
					numbers
				</label>
				<label>
					<input type="checkbox" id="symbols-checkbox">
					special characters
				</label>
				<input type="submit" value="Generate password" id="submit" class="button">
			</form>

			<div class="password-box">
				<p class="password-text"></p>
				<button class="copy-password-btn">Copy</button>
